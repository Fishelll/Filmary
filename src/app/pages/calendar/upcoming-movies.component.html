<div class="container mt-4 mb-5">
  <h3>Скоро в кіно</h3>
  <div class="row">
    <div class="col-md-3 mb-4" *ngFor="let movie of upcomingMovies">
      <a [routerLink]="['/movie', movie.id]" class="text-decoration-none text-dark">
        <div class="card h-100 shadow-sm">
          <img [src]="'https://image.tmdb.org/t/p/w300' + movie.poster_path" class="card-img-top" alt="{{ movie.title }}">
          <div class="card-body">
            <h6 class="card-title">{{ movie.title }}</h6>
            <p class="card-text">
              📅 Прем'єра: {{ movie.release_date | date:'longDate' }}
            </p>
          </div>
        </div>
      </a>
    </div>
  </div>
</div>
