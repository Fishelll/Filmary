<div class="container mt-4">
  <h2 class="mb-4">
    {{ searchQuery || selectedGenre || selectedYear ? 'Результати пошуку / фільтрації' : 'Популярні фільми' }}
  </h2>

  <!-- 🔍 Фільтри -->
  <div class="row g-3 align-items-end mb-4">
    <div class="col-md-3">
      <label class="form-label">Пошук</label>
      <input type="text" class="form-control" placeholder="Назва фільму..." [(ngModel)]="searchQuery" (ngModelChange)="onFilterChange()">
    </div>
    <div class="col-md-3">
      <label class="form-label">Жанр</label>
      <select class="form-select" [(ngModel)]="selectedGenre" (change)="onFilterChange()">
        <option value="">Всі жанри</option>
        <option *ngFor="let genre of genres" [value]="genre.id">{{ genre.name }}</option>
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label">Рік</label>
      <select class="form-select" [(ngModel)]="selectedYear" (change)="onFilterChange()">
        <option value="">Будь-який рік</option>
        <option *ngFor="let year of [2025, 2024, 2023, 2022, 2021, 2020]">{{ year }}</option>
      </select>
    </div>
    <div class="col-md-3">
      <button class="btn btn-outline-secondary w-100" (click)="resetFilters()">Очистити фільтри</button>
    </div>
  </div>

  <!-- 🎞️ Картки фільмів -->
  <div class="row">
    <div *ngFor="let movie of movies" class="col-sm-6 col-md-4 col-lg-3 mb-4">
      <a [routerLink]="['/movie', movie.id]" class="text-decoration-none text-dark">
        <div class="card h-100 shadow-sm rounded overflow-hidden">
          <img [src]="'https://image.tmdb.org/t/p/w300' + movie.poster_path" class="card-img-top" alt="{{ movie.title }}">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title text-truncate">{{ movie.title }}</h5>
            <p class="card-text mb-1">📅 {{ movie.release_date | date: 'yyyy' }}</p>
            <p class="card-text">⭐ {{ movie.vote_average }}</p>
          </div>
        </div>
      </a>
    </div>
  </div>

  <!-- 📄 Пагінація -->
  <div class="text-center my-4 d-flex justify-content-center align-items-center gap-3">
    <button class="btn btn-outline-secondary" (click)="changePage(page - 1)" [disabled]="page <= 1">← Попередня</button>
    <span>Сторінка {{ page }}</span>
    <button class="btn btn-outline-secondary" (click)="changePage(page + 1)">Наступна →</button>
  </div>
</div>
